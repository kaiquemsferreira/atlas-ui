  </atlas-doc-section>

  <atlas-doc-section titleKey="sandbox.pages.cards.variantsTitle" descriptionKey="sandbox.pages.cards.variantsDesc">

  <atlas-doc-section titleKey="sandbox.pages.cards.a11yTitle" descriptionKey="sandbox.pages.cards.a11yDesc">

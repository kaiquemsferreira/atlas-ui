<div class="atlas-field" [attr.data-float-label]="floatLabel ? 'true' : null"
     [class.atlas-field--has-prefix]="hasPrefix" [attr.data-invalid]="invalid ? 'true' : null">
  @if (!floatLabel && (label || labelKey)) {
    <label class="atlas-field__label">
      @if (labelKey) { {{ labelKey | translate }} } @else { {{ label }} }
    </label>
  }

  <div class="atlas-field__frame">
    @if (hasPrefix) {
      <span class="atlas-field__prefix" aria-hidden="true">
        <ng-content select="[atlasPrefixIcon]"></ng-content>
      </span>
    }

    <div class="atlas-field__body">
      @if (floatLabel && (label || labelKey)) {
        <label class="atlas-field__floating">
          @if (labelKey) { {{ labelKey | translate }} } @else { {{ label }} }
        </label>
      }
      <div class="atlas-field__control-slot">
        <ng-content></ng-content>
      </div>

      @if (hasSuffix || invalid) {
        <span class="atlas-field__suffix">
          <ng-content select="[atlasSuffix]"></ng-content>

          @if (invalid) {
            <span class="atlas-field__status" aria-hidden="true">
              <i class="ph ph-warning-circle"></i>
            </span>
          }
        </span>
      }
    </div>
  </div>

  @if (hint || hintKey) {
    <div class="atlas-field__hint">
      @if (hintKey) { {{ hintKey | translate }} } @else { {{ hint }} }
    </div>
  }
  <ng-content select="[atlasFieldMessage]"></ng-content>
</div>

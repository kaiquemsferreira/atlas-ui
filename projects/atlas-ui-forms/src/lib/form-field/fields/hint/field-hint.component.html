<atlas-tooltip>
  <button atlasTooltipTrigger class="atlas-field-hint" type="button" [attr.aria-label]="ariaLabel">
    <i class="ph ph-question"></i>
  </button>

  <ng-container atlasTooltipContent>
    @if (textKey) { {{ textKey | translate }} }
    @else { {{ text }} }
  </ng-container>
</atlas-tooltip>

<span class="atlas-checkbox">
  <span class="atlas-checkbox__box" aria-hidden="true">
    @if (indeterminate) {
      <span class="atlas-checkbox__mark atlas-checkbox__mark--indeterminate"></span>
    } @else if (checked) {
      <span class="atlas-checkbox__mark atlas-checkbox__mark--check"></span>
    }
  </span>
</span>
